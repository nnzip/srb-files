<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사 기록 · NEA SRB</title>

<style>
:root{
  --bg:#111113; --panel:#18181b; --panel2:#1d1d21; --line:#26262a;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* header */
.top{display:flex;justify-content:space-between;padding:22px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--mut)}
.hero{padding:34px 0 8px}
.hero h1{margin:0;font-size:clamp(34px,7vw,56px);font-weight:900;line-height:1;color:var(--head);letter-spacing:-1px}
.hero h1 i{font-style:normal;color:var(--red)}
.hero .sub{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--red);margin-top:12px}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:rgba(17,17,19,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 0 12px;margin-top:18px;border-bottom:1px solid var(--line)}
.bar-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--panel);color:var(--mut);font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--ink)}
.chip b{font-family:var(--mono);font-weight:400;font-size:10px;margin-right:5px;color:var(--c,var(--dim))}
.chip.on{color:var(--head);border-color:var(--c,var(--mut));background:var(--panel2)}
.search{flex:0 1 220px;min-width:150px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12.5px;padding:7px 12px 7px 30px;border-radius:999px;outline:none}
.search input:focus{border-color:var(--mut)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:11px;top:50%;margin-top:-6px;width:12px;height:12px;stroke:var(--dim)}

/* sections */
.dept{padding:34px 0 4px;scroll-margin-top:70px}
.dept-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dept-h .no{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--c)}
.dept-h h2{margin:0;font-size:24px;font-weight:900;line-height:1;color:var(--head);letter-spacing:-.3px}
.dept-h .ko{font-size:12px;color:var(--mut)}
.dept-h .n{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}

/* card */
.card{background:var(--panel);border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid transparent;transition:border-color .2s,transform .2s;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:var(--line);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.ph{aspect-ratio:3/4;background:#222226 center top/cover no-repeat;position:relative}
.ph .gr{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--bg);background:var(--c);border-radius:5px;padding:2px 7px;font-weight:700}
.bd{padding:11px 13px 13px}
.nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.nm b{font-size:15px;font-weight:800;color:var(--head)}
.nm span{font-size:10.5px;color:var(--mut)}
.rk{font-size:11px;color:var(--c);margin-top:1px}
.rows{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.85}
.rows div{display:flex;gap:8px}
.rows em{font-style:normal;color:var(--mut);flex:0 0 28px}

.empty{display:none;text-align:center;color:var(--dim);font-size:13px;padding:60px 0}
.foot{margin-top:50px;padding:18px 0 26px;border-top:1px solid var(--line);text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--dim)}

/* detail */

.dlg.on{display:flex}
.box{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border-radius:20px;display:flex;flex-wrap:wrap;position:relative;border:1px solid var(--line)}
.box .big{flex:1 1 240px;min-height:320px;background:#222226 center center/cover no-repeat}
.box .info{flex:1 1 260px;padding:24px 24px 26px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.box .dp{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--c);padding-right:34px}
.box h3{margin:8px 0 2px;font-size:26px;font-weight:900;color:var(--head);line-height:1.15}
.box .meta{font-size:12px;color:var(--mut)}
.box .rk2{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;color:var(--bg);background:var(--c);border-radius:5px;padding:2px 8px}
.box .rows{font-size:13px;margin-top:16px;padding-top:12px;align-self:stretch}
.box .rows em{flex-basis:34px}
.x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(17,17,19,.7);color:var(--ink);font-size:18px;line-height:32px;cursor:pointer}
.langs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.langs button{border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:4px 9px;border-radius:999px;cursor:pointer;letter-spacing:0}
.langs button:hover{color:var(--ink)}
.langs button.on{background:var(--panel2);color:var(--head)}
.top{align-items:center;flex-wrap:wrap;gap:10px}
.rows{display:grid;grid-template-columns:auto 1fr;column-gap:10px}
.rows div{display:contents}
:lang(ja) body,html:lang(ja){font-family:Pretendard,'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif}
html:lang(zh-Hans){font-family:Pretendard,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
html:lang(zh-Hant){font-family:Pretendard,'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif}
html:lang(ja) body,html:lang(zh-Hans) body,html:lang(zh-Hant) body{font-family:inherit}
@media (max-width:520px){
  .wrap{padding:0 14px}

  .nm b{font-size:14px}
  .rows{font-size:11px}
  .search{flex:1 1 100%}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ───────── 화면 글자 ───────── */
const LANGS = [
  { k:"ko",   btn:"KO",     html:"ko" },
  { k:"en",   btn:"EN",     html:"en" },
  { k:"ja",   btn:"日本語", html:"ja" },
  { k:"hans", btn:"简体",   html:"zh-Hans" },
  { k:"hant", btn:"繁體",   html:"zh-Hant" },
  { k:"es",   btn:"ES",     html:"es" },
];
const UI = {
  title:  ["인사 기록","Personnel Records","人事記録","人事记录","人事記錄","Expedientes"],
  all:    ["전체","All","全体","全部","全部","Todos"],
  search: ["이름 · 이능 · 계열 검색","Search name · ability · type","名前・異能・系統で検索","搜索姓名 · 异能 · 系别","搜尋姓名 · 異能 · 系別","Buscar nombre · habilidad · tipo"],
  empty:  ["해당하는 기록이 없습니다.","No matching records.","該当する記録はありません。","没有符合的记录。","沒有符合的記錄。","No hay registros que coincidan."],
  grade:  ["등급","Class","等級","等级","等級","Clase"],
  kind:   ["계열","Type","系統","系别","系別","Tipo"],
  ability:["이능","Ability","異能","异能","異能","Habilidad"],
  close:  ["닫기","Close","閉じる","关闭","關閉","Cerrar"],
};
const SEX = { m:["남","M","男","男","男","H"], f:["여","F","女","女","女","M"] };
function fmtGrade(g, li){
  if(g==="—") return "—";
  return [g+"급", g+"-Class", g+"級", g+"级", g+"級", "Clase "+g][li];
}
function fmtAge(a, li){
  if(a.endsWith("s?")){ const n=a.slice(0,-2);
    return [n+"대 추정","est. "+n+"s",n+"代と推定","推测"+n+"多岁","推測"+n+"多歲","unos "+n+" (est.)"][li]; }
  return [a+"세",a,a+"歳",a+"岁",a+"歲",a+" años"][li];
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let li = 0, cur = 'all', query = '';
const pick = arr => arr[li] ?? arr[0];

/* 언어: 주소 ?lang=ja → 지난번 선택 → 한국어 */
(function(){
  let want = new URLSearchParams(location.search).get('lang');
  if(!want){ try{ want = localStorage.getItem('srb-lang'); }catch(e){} }
  const i = LANGS.findIndex(l=>l.k===want || (want==='zh-hans'&&l.k==='hans') || (want==='zh-hant'&&l.k==='hant'));
  if(i>=0) li = i;
})();

const total = DEPTS.reduce((n,d)=>n+d.people.length,0);
const info = p => SEX[p.sex][li] + ' · ' + fmtAge(p.age, li);
function rows(p, withGrade){
  return `<div class="rows">${withGrade?`<div><em>${pick(UI.grade)}</em><span>${fmtGrade(p.grade,li)}</span></div>`:''}`+
    `<div><em>${pick(UI.kind)}</em><span>${esc(pick(p.kind))}</span></div><div><em>${pick(UI.ability)}</em><span>${esc(pick(p.ability))}</span></div></div>`;
}
function chrome(){
  document.documentElement.lang = LANGS[li].html;
  document.title = pick(UI.title) + ' · NEA SRB';
  $('#ttl').textContent = pick(UI.title);
  $('#cnt').textContent = 'PERSONNEL FILE · ' + total;
  $('#q').placeholder = pick(UI.search);
  $('#empty').textContent = pick(UI.empty);
  $('#langs').innerHTML = LANGS.map((l,i)=>`<button class="${i===li?'on':''}" data-i="${i}" lang="${l.html}">${l.btn}</button>`).join('');
  $('#chips').innerHTML =
    `<button class="chip${cur==='all'?' on':''}" data-k="all"><b>00</b>${pick(UI.all)}</button>` +
    DEPTS.map(d=>`<button class="chip${cur===d.no?' on':''}" data-k="${d.no}" style="--c:${d.color}"><b>${d.no}</b>${esc(pick(d.label))}</button>`).join('');
}
function render(){
  const q = query.trim().toLowerCase();
  let shown = 0;
  $('#list').innerHTML = DEPTS.filter(d=>cur==='all'||d.no===cur).map(d=>{
    const ps = d.people.map((p,i)=>({p,i})).filter(({p})=>!q ||
      [...p.name,...p.rank,...p.kind,...p.ability,fmtGrade(p.grade,li),...d.label,d.en].join(' ').toLowerCase().includes(q));
    if(!ps.length) return '';
    shown += ps.length;
    const sub = pick(d.label).toUpperCase()===d.en ? '' : esc(pick(d.label));
    return `<section class="dept" id="d${d.no}" style="--c:${d.color}">
      <div class="dept-h"><span class="no">${d.no}</span><h2>${esc(d.en)}</h2><span class="ko">${sub}</span><span class="n">${ps.length} / ${d.people.length}</span></div>
      <div class="grid">${ps.map(({p,i})=>`
        <button class="card" data-d="${d.no}" data-i="${i}">
          <div class="ph" style="background-image:url('${esc(p.img)}')"><span class="gr">${fmtGrade(p.grade,li)}</span></div>
          <div class="bd"><div class="nm"><b>${esc(pick(p.name))}</b><span>${info(p)}</span></div><div class="rk">${esc(pick(p.rank))}</div>${rows(p,false)}</div>
        </button>`).join('')}</div></section>`;
  }).join('');
  $('#empty').style.display = shown ? 'none' : 'block';
}
$('#langs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  li = +b.dataset.i;
  try{ localStorage.setItem('srb-lang', LANGS[li].k); }catch(e){}
  const u = new URL(location.href); u.searchParams.set('lang', LANGS[li].k); history.replaceState(null,'',u);
  chrome(); render();
});
$('#chips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  cur = b.dataset.k;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===b));
  render();
  window.scrollTo({top: $('#list').offsetTop - 70});
});
$('#q').addEventListener('input', e=>{ query = e.target.value; render(); });

function openP(dn,i){
  const d = DEPTS.find(x=>x.no===dn), p = d.people[i];
  const box = $('#box');
  box.style.setProperty('--c', d.color);
  box.innerHTML = `<button class="x" aria-label="${pick(UI.close)}">×</button>
    <div class="big" style="background-image:url('${esc(p.img)}')"></div>
    <div class="info"><div class="dp">${d.no} · ${esc(d.en)}${pick(d.label).toUpperCase()===d.en?'':' · '+esc(pick(d.label))}</div>
      <h3>${esc(pick(p.name))}</h3><div class="meta">${info(p)}</div>
      <span class="rk2">${esc(pick(p.rank))}</span>${rows(p,true)}</div>`;
  $('#dlg').classList.add('on');
}
$('#list').addEventListener('click', e=>{ const c = e.target.closest('.card'); if(c) openP(c.dataset.d, +c.dataset.i); });
$('#dlg').addEventListener('click', e=>{ if(e.target.id==='dlg' || e.target.closest('.x')) $('#dlg').classList.remove('on'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#dlg').classList.remove('on'); });
chrome(); render();
</script>
</body>
</html>
